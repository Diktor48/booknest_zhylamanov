<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выдача книги — BookNest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body class="page">
  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="BookNest, на главную">BookNest</a>
    <nav class="site-nav" aria-label="Основная навигация">
      <ul class="site-nav__list">
        <li><a class="site-nav__link" href="index.html">Каталог</a></li>
        <li><a class="site-nav__link" href="book.html">Карточка книги</a></li>
        <li><a class="site-nav__link" href="loan.html" aria-current="page">Выдача книги</a></li>
      </ul>
    </nav>
  </header>

  <main class="site-main loan-page">
    <h1 class="page-title">Выдача книги</h1>
    <p class="page-lead">Заполните форму, чтобы взять книгу из каталога. Поля, отмеченные звёздочкой, обязательны.</p>

    <form class="form" action="/api/loans" method="post">
      <fieldset class="form__group">
        <legend class="form__legend">Данные читателя</legend>
        <p class="form__field">
          <label class="form__label" for="reader">Имя и фамилия *</label>
          <input class="form__input" id="reader" name="reader_name" type="text" required minlength="2" maxlength="80" autocomplete="name">
        </p>
        <p class="form__field">
          <label class="form__label" for="email">E-mail для напоминаний *</label>
          <input class="form__input" id="email" name="email" type="email" required placeholder="student@university.kz" autocomplete="email">
        </p>
        <p class="form__field">
          <label class="form__label" for="phone">Телефон</label>
          <input class="form__input" id="phone" name="phone" type="tel" pattern="\+?[0-9]{10,15}" title="От 10 до 15 цифр, можно с плюсом в начале" autocomplete="tel">
        </p>
      </fieldset>

      <fieldset class="form__group">
        <legend class="form__legend">Параметры выдачи</legend>
        <p class="form__field">
          <label class="form__label" for="book">Книга *</label>
          <select class="form__select" id="book" name="book_id" required>
            <option value="">Выберите книгу</option>
            <option value="1">Солярис</option>
            <option value="2">Пикник на обочине</option>
            <option value="3">Чистый код</option>
            <option value="5">Евгений Онегин</option>
            <option value="6">SPQR. История Древнего Рима</option>
          </select>
        </p>
        <p class="form__field">
          <label class="form__label" for="due">Вернуть до *</label>
          <input class="form__input" id="due" name="due_date" type="date" required min="2026-10-04">
        </p>
        <p class="form__field">
          <label class="form__label" for="copies">Количество экземпляров</label>
          <input class="form__input" id="copies" name="copies" type="number" value="1" min="1" max="3">
        </p>
        <p class="form__field">
          <label class="form__label" for="note">Примечание</label>
          <textarea class="form__textarea" id="note" name="note" rows="3" maxlength="300"></textarea>
        </p>
      </fieldset>

      <p class="form__field form__field--check">
        <input class="form__check" id="agree" name="agree" type="checkbox" value="1" required>
        <label class="form__label form__label--inline" for="agree">Обязуюсь вернуть книгу в срок *</label>
      </p>
        <button class="btn btn--primary" type="submit">Выдать книгу</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Книжный клуб университета</p>
  </footer>
</body>
</html>
